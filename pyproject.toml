[build-system]
requires = ["setuptools>=77", "packaging>=24.2", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "foveawam"
version = "0.1.0"
description = "Role-aware 4D world-action modeling for dynamic manipulation"
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = "Apache-2.0"
license-files = ["LICENSE", "THIRD_PARTY_NOTICES.md", "MODEL_LICENSE.md"]
dependencies = [
    "hydra-core>=1.3,<2",
    "h5py>=3.11,<4",
    "numpy>=1.26,<2",
    "omegaconf>=2.3,<3",
    "scipy>=1.13,<1.17",
    "safetensors>=0.7,<1",
    "torch>=2.11",
    "transformers==5.12.1",
]

[project.optional-dependencies]
ontimebench = ["ontimebench @ git+https://github.com/ArrebolBlack/OnTimeBench@v0.1.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
foveawam = ["py.typed", "configs/*.yaml", "configs/latency_rtx5090.json"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"src/foveawam/api.py" = ["I001"]
"src/foveawam/inference/policy.py" = ["N803", "N806"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src"]
